name: MediKiosk release quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run quality
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
